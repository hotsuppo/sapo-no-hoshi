</style></head><body><main id="app"><header><h1>さぽの星</h1><div class="tools"><button id="sound" aria-pressed="false">音：なし</button><button id="pause">休憩</button><button id="full">全画面</button></div></header><div id="level" aria-live="polite">90秒チャレンジ</div><section id="stage" aria-label="守備と打撃の野球特訓ゲーム"><canvas id="field" width="960" height="1360"></canvas><div id="hud"><span id="score"><small>得点</small><strong id="scoreValue">0</strong><em>点</em><small id="catchValue">0球キャッチ</small></span><span id="count"><small>残り</small><strong id="timeValue">90</strong><em>秒</em></span></div><div id="message" aria-live="polite"></div><div id="memoryBoard" hidden aria-label="出た順にマスをタッチ"></div><div id="panel"><div class="card" id="card"></div></div></section><footer id="help">画面の下で指を左右にすべらせて、選手を動かそう</footer></main>
<script>
'use strict';
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),panel=document.getElementById('panel'),card=document.getElementById('card'),msg=document.getElementById('message');
const W=480,H=680;const buffer=document.createElement('canvas');buffer.width=W;buffer.height=H;const g=buffer.getContext('2d');ctx.imageSmoothingEnabled=false;
let elapsed=0,attempts=0,caughtFly=false,stun=0;let mode='title',score=0,shot=0,x=240,targetX=240,clock=0,balls=[],wait=.7,swingTimer=0,dust=null,nextDust=18,previousLanding=240,misses=[],pose=0,feedback=0,muted=true,audioCtx=null,last=0,keys={},pointer=null;
const $=id=>document.getElementById(id);
const RECORD_KEY='wakuwaku-baseball:defense:v2',LEGACY_KEY='wakuwaku-baseball:defense:v1';let captures=0,goldCaught=0;let currentRecord=null,memoryRecords=[],saveAvailable=true;
function readRecords(legacy=false){try{const raw=localStorage.getItem(legacy?LEGACY_KEY:RECORD_KEY);if(!raw)return legacy?[]:memoryRecords;const a=JSON.parse(raw);if(!Array.isArray(a))return legacy?[]:memoryRecords;return a.filter(r=>r&&typeof r.id==='string'&&Number.isFinite(r.score)&&Number.isFinite(r.time)&&typeof r.name==='string').slice(-100)}catch(e){return legacy?[]:memoryRecords}}
function writeRecords(records){memoryRecords=records.slice(-100);try{localStorage.setItem(RECORD_KEY,JSON.stringify(memoryRecords));saveAvailable=true;return true}catch(e){saveAvailable=false;return false}}
function sortedRecords(legacy=false){return readRecords(legacy).slice().sort((a,b)=>b.score-a.score||a.time-b.time)}
function escapeText(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ranking(back=title,legacy=false){mode='ranking';panel.hidden=false;msg.textContent='';$('pause').disabled=true;const records=sortedRecords(legacy).slice(0,10);card.innerHTML='<h2>'+(legacy?'旧ルールの記録':'守備ランキング')+'</h2><p class="save-note">この端末の上位10件<br>'+(legacy?'1キャッチ＝1点':'通常のボール＝1点 ／ 金色＝3点')+'</p>'+(records.length?'<table class="ranking"><thead><tr><th>順位</th><th>名前</th><th>得点</th></tr></thead><tbody>'+records.map((r,i)=>'<tr><td>'+ (i+1)+'</td><td>'+escapeText(r.name)+'<span class="rank-date">'+escapeText(new Date(r.time).toLocaleDateString('ja-JP'))+'</span></td><td>'+r.score+'点</td></tr>').join('')+'</tbody></table>':'<p>まだ記録がありません</p>')+((legacy||readRecords(true).length)?'<button class="secondary" id="rankRule">'+(legacy?'現在のランキング':'旧ルールの記録')+'</button><br>':'')+'<button class="secondary" id="rankBack">戻る</button>';$('rankBack').onclick=back;if(legacy||readRecords(true).length)$('rankRule').onclick=()=>ranking(back,!legacy)}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}function poly(points,c){g.fillStyle=c;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}

function tone(freq,len,type='square',volume=.035){if(muted)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);v.gain.setValueAtTime(volume,audioCtx.currentTime);v.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+len);o.connect(v);v.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+len)}catch(e){}}
function hideMemory(){$('app').setAttribute('data-screen','game');if(typeof batting!=='undefined')batting.hide();keys={};pointer=null;}
function title(){hideMemory();$('app').setAttribute('data-screen','title');mode='title';elapsed=0;stun=0;balls=[];misses=[];dust=null;panel.hidden=false;msg.textContent='';$('pause').disabled=true;$('level').textContent='モードを選ぼう';$('level').style.color='#fff9df';$('timeValue').textContent='90';$('scoreValue').textContent='0';$('catchValue').textContent='';$('help').textContent='守備も打撃も、1プレイ90秒';card.innerHTML='<img class="title-scene" src="title-scene-v1.png" alt="" aria-hidden="true"><img class="title-logo" src="title-logo-v1.png" alt="さぽの星"><nav class="title-menu" aria-label="遊ぶモードを選ぶ"><button class="title-mode" id="battingMode"><span class="title-icon bat" aria-hidden="true"></span><span>打撃練習</span></button><button class="title-mode" id="defenseMode"><span class="title-icon glove" aria-hidden="true"></span><span>守備練習</span></button><button class="title-mode" id="chooseRanking"><span class="title-icon trophy" aria-hidden="true"></span><span>ランキング</span></button></nav>';$('defenseMode').onclick=defenseTitle;$('battingMode').onclick=()=>batting.intro();$('chooseRanking').onclick=rankMenu;}
function rankMenu(){hideMemory();mode='ranking';panel.hidden=false;card.innerHTML='<h2>ランキング</h2><button class="main blue" id="defenseRanks">守備ランキング</button><button class="main" id="battingRanks">打撃ランキング</button><button class="secondary" id="home">トップに戻る</button>';$('defenseRanks').onclick=()=>ranking(rankMenu);$('battingRanks').onclick=()=>batting.ranking(rankMenu);$('home').onclick=title;}
function defenseTitle(){hideMemory();mode='title';elapsed=0;stun=0;$('help').textContent='画面の下で指を左右にすべらせて、選手を動かそう';panel.hidden=false;msg.textContent='';card.innerHTML='<h2>鬼の千本ノック</h2><p>選手を左右に動かしてキャッチ！<br>90秒間の連続ノック！</p><p style="font-size:16px">金色のボールは3点！<br>燃える球に触れると１秒動けない！<br>終盤は次々に打球が来るよ！</p><button class="main" id="start">特訓スタート</button><button class="secondary" id="defenseHome">戻る</button>';$('start').onclick=start;syncDefenseImages();$('defenseHome').onclick=title;$('pause').disabled=true;$('level').textContent='90秒チャレンジ';$('timeValue').textContent='90';$('scoreValue').textContent='0';$('catchValue').textContent='0球キャッチ';}
function start(){hideMemory();$('help').textContent='画面の下で指を左右にすべらせて、選手を動かそう';currentRecord=null;mode='play';panel.hidden=true;score=shot=attempts=captures=goldCaught=0;elapsed=0;stun=0;x=targetX=240;balls=[];misses=[];wait=.7;swingTimer=0;fielderMotion=0;dust=null;nextDust=18;previousLanding=240;feedback=pose=0;msg.textContent='';updateHud();$('pause').disabled=false;tone(440,.1)}
function updateHud(){$('scoreValue').textContent=score;$('catchValue').textContent=captures+'球キャッチ';$('timeValue').textContent=Math.max(0,Math.ceil(90-elapsed));$('level').textContent=stun>0?'熱っ！ 少し待って！':dust?'砂嵐に気をつけて！':elapsed<30?'ノック開始！':elapsed<60?'連続ノック！':'炎の連続ノック！';$('level').style.color=elapsed>=60?'#ffb559':'#fff9df';}

function finish(){mode='result';stun=0;balls=[];dust=null;misses=[];msg.textContent='';$('pause').disabled=true;currentRecord={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),name:'ゲスト',score,captures,goldCaught,time:Date.now()};const records=readRecords();records.push(currentRecord);writeRecords(records);resultView()}
function resultView(){mode='result';panel.hidden=false;const position=sortedRecords().findIndex(r=>r.id===currentRecord.id)+1;card.innerHTML='<h2>おつかれさま！</h2><p style="font-weight:900;font-size:32px">'+score+'点 ／ '+captures+'球キャッチ</p><p>捕球率 '+(attempts?Math.round(captures/attempts*100):0)+'％ ／ 金色 '+goldCaught+'球'+(position>0&&position<=10?' ／ 第'+position+'位！':'')+'</p><p class="save-note" id="saveNote">'+(saveAvailable?'得点を保存しました。名前も登録できます。':'このブラウザでは保存できませんでした。')+'</p><div class="name-row"><input id="playerName" type="text" maxlength="12" aria-label="ランキングに残す名前" placeholder="お名前（省略可）" autocomplete="off"><button class="secondary" id="saveName">登録</button></div><button class="secondary" id="ranks">ランキング</button><button class="main" id="again">もう一度</button><button class="secondary" id="home">タイトルに戻る</button>';$('playerName').value=currentRecord.name==='ゲスト'?'':currentRecord.name;$('saveName').onclick=()=>{const name=$('playerName').value.trim().slice(0,12)||'ゲスト';currentRecord.name=name;const records=readRecords().map(r=>r.id===currentRecord.id?{...r,name}:r);const ok=writeRecords(records);$('saveNote').textContent=ok?'名前を登録しました！':'このブラウザでは保存できませんでした。'};$('ranks').onclick=()=>ranking(resultView);$('again').onclick=start;$('home').onclick=title;}
function pace(time=elapsed){const p=Math.min(1,time/90);return {flight:2.45-1.6*p,interval:time<30?2.7-time*.035:time<60?1.65-(time-30)*.025:.9-(time-60)*(.56/30)}}
function newBall(age=0){let landing=52+Math.random()*376;if(elapsed>=60){for(let i=0;i<6&&Math.abs(landing-previousLanding)<150;i++)landing=52+Math.random()*376}previousLanding=landing;const next=shot+1,gold=next%7===0,fire=elapsed>=10&&next%6===0&&!gold;balls.push({t:age,d:pace().flight,end:landing,fly:Math.random()<.42,gold,fire,id:++shot});swingTimer=.24;tone(elapsed>=60?1150:900,.055,'triangle',.055)}
function smoothStep(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)}
function lighting(time=elapsed){return {sunset:smoothStep((time-50)/2),night:smoothStep((time-75)/2)}}
function mixColor(a,b,t){const rgb=c=>Array.isArray(c)?c:c.startsWith('#')?[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]:c.match(/\d+/g).map(Number);a=rgb(a);b=rgb(b);return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function background(view='defense'){const horizon=view==='defense'?103:425,fieldStart=horizon+13;const state=lighting(mode==='title'?0:elapsed),dusk=state.sunset,night=state.night,shade=(day,eve,dark)=>mixColor(mixColor(day,eve,dusk),dark,night),skyTop=shade('#7dbabd','#bf777e','#142b46'),skyBottom=shade('#a5d0c2','#efad70','#35465d');rect(0,0,W,H,skyTop);for(let y=0;y<horizon;y+=5)rect(0,y,480,5,mixColor(skyTop,skyBottom,y/horizon));if(night<.96){g.save();g.globalAlpha=1-night;ellipse(302,25+dusk*72,13,13,mixColor('#fff0af','#ffca75',dusk));g.restore()}if(night>0){g.save();g.globalAlpha=night;for(let i=0;i<18;i++)rect(16+(i*83)%450,12+(i*13)%43,2,2,'#dbe6d7');ellipse(309,29,11,11,'#ece8c5');ellipse(314,25,10,10,skyTop);g.restore()}rect(0,horizon-34,480,25,shade('#d0e4c8','#bbad87','#3d5657'));for(let i=0;i<16;i++){rect(i*33,horizon-36-(i%3)*8,28,39,shade('#387a53','#596247','#193b38'));rect(i*33+4,horizon-43-(i%3)*8,18,14,shade('#4b9160','#72774d','#274847'))}rect(0,horizon,480,13,shade('#204f43','#3e493b','#153038'));const top=shade('#d1a857','#b1804c','#747a73'),bottom=shade('#d9b773','#c59760','#aaa58c');const fieldBottom=view==='defense'?594:680;for(let y=fieldStart;y<fieldBottom;y+=8)rect(0,y,480,8,mixColor(top,bottom,(y-fieldStart)/(fieldBottom-fieldStart)));const dirt1=shade('#c79e5b','#a77948','#7c8174'),dirt2=shade('#e1bb78','#cda571','#b3ae93');for(let i=0;i<160;i++){let a=(i*97)%480,b=view==='defense'?120+(i*43)%466:fieldStart+4+(i*43)%(fieldBottom-fieldStart-8);rect(a,b,3,1,i%2?dirt1:dirt2)}if(night>0){g.save();g.globalAlpha=.08*night;poly([[68,58],[77,58],[350,594],[-130,594]],'#f4f2ca');poly([[403,58],[412,58],[610,594],[130,594]],'#f4f2ca');ellipse(240,435,260,170,'#f4f2ca');g.restore()}const chalk=shade('#fff0cc','#f0dfbf','#ecefdd');if(view==='defense'){poly([[237,182],[240,185],[0,526],[0,517]],chalk);poly([[240,185],[243,182],[480,517],[480,526]],chalk);for(const bx of [214,252]){rect(bx,154,14,2,chalk);rect(bx,174,14,2,chalk);rect(bx,154,2,22,ch
